<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>FC Mobile · Manager Turnee Interligi</title>
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0a0f1c;--panel:#111a2d;--panel2:#16213a;--panel3:#1c2947;--border:#24314f;--border2:#2f3d60;
  --text:#e8edf7;--muted:#8a97b5;--dim:#5d6a88;
  --acc:#1fe08a;--acc2:#3b82f6;--warn:#f5a524;--bad:#ef4b5b;--draw:#a0aec0;
  --r:14px;--sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(31,224,138,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(59,130,246,.08),transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* sidebar */
#sidebar{background:rgba(13,20,36,.9);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#0ea5e9);display:grid;place-items:center;color:#062;box-shadow:0 6px 18px rgba(31,224,138,.3)}
.brand .logo svg{stroke:#04261a;width:22px;height:22px}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
.tsel label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);display:block;margin:0 6px 6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(31,224,138,.16),rgba(31,224,138,.03));color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
.nav button.on svg{color:var(--acc)}
.side-foot{margin-top:auto;color:var(--dim);font-size:11.5px;padding:0 6px}
/* main */
main{min-width:0}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--border);background:rgba(10,15,28,.75);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
#topbar h1{font-size:17px;margin:0;font-weight:700}
#topbar .sub{color:var(--muted);font-size:12.5px}
#topbar .sp{flex:1}
.savebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.savebadge i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.savebadge.ok i{background:var(--acc)}
#view{padding:24px 28px 60px;max-width:1400px}
/* elements */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#4a5a82;background:var(--panel3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#04261a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.danger{color:#ffb3ba;border-color:rgba(239,75,91,.4);background:rgba(239,75,91,.08)}
.btn.danger:hover{background:rgba(239,75,91,.18)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--panel3);color:var(--text);border-color:var(--border2)}
.icon-btn.danger:hover{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:linear-gradient(180deg,var(--panel),rgba(17,26,45,.85));border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 14px;font-size:14px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h2{margin:0;font-size:24px;letter-spacing:-.3px}
.ph p{margin:4px 0 0;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--border2);background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--acc);border-color:rgba(31,224,138,.35);background:rgba(31,224,138,.08)}
.chip.warn{color:var(--warn);border-color:rgba(245,165,36,.35);background:rgba(245,165,36,.08)}
.chip.bad{color:var(--bad);border-color:rgba(239,75,91,.35);background:rgba(239,75,91,.08)}
.chip.blue{color:#8bb8ff;border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.1)}
.bar{height:8px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#22d3ee);border-radius:99px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--border2);border-radius:var(--r)}
.banner{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:rgba(245,165,36,.08);border:1px solid rgba(245,165,36,.3);color:#ffd590;margin-bottom:16px}
.banner.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.3);color:#b8d2ff}
/* tables */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:700;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.s{cursor:pointer;user-select:none}.tbl th.s:hover{color:var(--text)}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(36,49,79,.6);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(28,41,71,.45)}
.tbl .c{text-align:center}.tbl .r{text-align:right}
.tbl .b{font-weight:800}
.pos{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--panel3);font-weight:800;font-size:12px}
.pos.p1{background:linear-gradient(135deg,#f6d365,#d4a017);color:#2b1d00}
.pos.p2{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#1f2937}
.pos.p3{background:linear-gradient(135deg,#f0b27a,#b4652b);color:#2b1300}
.form{display:inline-flex;gap:3px}
.form b{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:10px;color:#061}
.form .V{background:var(--acc)}.form .E{background:#94a3b8;color:#111}.form .I{background:var(--bad);color:#fff}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emb{object-fit:contain;flex:none;display:block}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
.pl{display:flex;align-items:center;gap:9px;min-width:0}
.pl .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .t{font-size:11.5px;color:var(--muted)}
.clickable{cursor:pointer}
/* forms */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:12px;color:var(--muted);font-weight:600}
.fg .hint{font-size:11.5px;color:var(--dim)}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],select,textarea{background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,224,138,.15)}
input[type=color]{width:48px;height:38px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);padding:3px;cursor:pointer}
textarea{min-height:160px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:center;cursor:pointer;font-size:13px}
.uploader{display:flex;align-items:center;gap:14px}
.uploader .prev{width:64px;height:64px;border-radius:14px;border:1px dashed var(--border2);display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.uploader .prev img{max-width:100%;max-height:100%}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,14,.7);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:20px;animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:18px;width:min(520px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh);animation:up .18s}
.modal.wide{width:min(760px,100%)}
.modal form{display:flex;flex-direction:column;min-height:0}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mhead h3{margin:0;font-size:16px}
.mbody{padding:20px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(12px);opacity:0}}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--panel3);border:1px solid var(--border2);border-left:4px solid var(--acc);padding:11px 15px;border-radius:10px;box-shadow:var(--sh);max-width:360px;animation:up .2s}
.toast.err{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
/* league cards */
.lcard{position:relative;overflow:hidden}
.lcard:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--lc)}
.lcard .top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lcard h4{margin:0;font-size:16px}
.lcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.lcard .stats div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.lcard .stats b{display:block;font-size:17px}
.lcard .stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* fixtures */
.round{margin-bottom:22px}
.round-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.round-h h3{margin:0;font-size:15px}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.15s}
.fx:hover{border-color:#41527b;transform:translateY(-1px)}
.fx .home{justify-content:flex-end;text-align:right}
.fx .sc{min-width:92px;text-align:center}
.fx .sc .s{font-size:20px;font-weight:800;letter-spacing:1px}
.fx .sc .vs{font-weight:700;color:var(--dim)}
.fxlist{display:grid;gap:10px}
.win{color:var(--acc)}
/* fixture page */
.match-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:26px;border-radius:18px;border:1px solid var(--border);background:linear-gradient(120deg,color-mix(in srgb,var(--hc) 18%,transparent),transparent 40%,transparent 60%,color-mix(in srgb,var(--ac) 18%,transparent)),var(--panel);margin-bottom:18px}
.match-head .side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.match-head .side h3{margin:0;font-size:20px}
.match-head .score{text-align:center}
.match-head .score .big{font-size:46px;font-weight:900;letter-spacing:2px;line-height:1}
.match-head .score .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:6px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;user-select:none;transition:.12s}
.pick:hover{border-color:var(--border2)}
.pick.on{border-color:var(--acc);background:rgba(31,224,138,.07)}
.pick .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);display:grid;place-items:center;flex:none}
.pick.on .box{background:var(--acc);border-color:var(--acc)}
.pick.on .box:after{content:"";width:8px;height:4px;border:2px solid #04261a;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.duels td{padding:8px 10px}
.duels .pl{max-width:220px}
.gi{display:inline-flex;align-items:center;gap:4px}
.gi input{width:46px;text-align:center;padding:7px 4px;font-weight:700;-moz-appearance:textfield}
.gi input::-webkit-outer-spin-button,.gi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gi input:disabled{opacity:.4}
.tot{font-weight:800;font-size:15px;text-align:center;white-space:nowrap}
.duels tr.H td.hcell{background:rgba(31,224,138,.08)}
.duels tr.A td.acell{background:rgba(31,224,138,.08)}
.duels tr.H td.hcell .n,.duels tr.A td.acell .n{color:var(--acc)}
.duels tr.D td.tot{color:var(--draw)}
.duels select{width:auto;padding:6px 8px;font-size:12px}
.reveal tbody tr{animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
.matrix td,.matrix th{text-align:center}
.matrix td.self{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 6px,var(--panel) 6px,var(--panel) 12px)}
.mx{font-weight:800;padding:3px 8px;border-radius:6px;display:inline-block}
.mx.V{background:rgba(31,224,138,.15);color:var(--acc)}.mx.I{background:rgba(239,75,91,.15);color:#ff8d98}.mx.E{background:rgba(160,174,192,.15);color:#cbd5e1}
.hbar{display:grid;grid-template-columns:140px 1fr 50px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.hbar .bar{height:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(36,49,79,.6)}
.li:last-child{border-bottom:0}
.li .sp{flex:1;min-width:0}
.rank{width:22px;color:var(--dim);font-weight:800;text-align:center}
.hero{padding:40px;border-radius:20px;border:1px solid var(--border);background:radial-gradient(600px 300px at 90% 0%,rgba(31,224,138,.15),transparent 60%),var(--panel)}
.hero h1{font-size:30px;margin:0 0 8px;letter-spacing:-.5px}
.hero p{color:var(--muted);max-width:640px;margin:0 0 22px;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;counter-increment:s;color:var(--muted);font-size:13px}
.steps li:before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(31,224,138,.15);color:var(--acc);font-weight:800;margin-bottom:8px}
.steps li b{color:var(--text);display:block;margin-bottom:2px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--panel3);color:var(--text)}
.tlist .li{gap:10px}
html{-webkit-text-size-adjust:100%}
/* turnee */
.tcard{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer}
.tcard:hover,.tcard.on{border-color:var(--acc)}
.tcard b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard>div>span{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11.5px;margin-top:3px}
.tlink{display:flex;align-items:center;gap:6px;margin-top:6px;padding:4px 6px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.tlink:hover{color:var(--acc)}
.tchev{display:inline-block;vertical-align:middle;color:var(--muted)}
.ttl.clickable:hover h1{color:var(--acc)}
.sect{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 12px}
.tcardx.cur{border-color:rgba(59,130,246,.5)}
.champ{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:86px;max-width:110px}
.champ span{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--warn);font-weight:700}
.champ b{font-size:12.5px;line-height:1.2}
.champhero{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:16px;border-radius:18px;border:1px solid rgba(245,165,36,.45);background:linear-gradient(120deg,rgba(245,165,36,.18),transparent 60%),var(--panel)}
.champhero>div{flex:1;min-width:0}.champhero>svg{color:#f6d365}
/* roluri */
.role-viewer .adm,.role-editor .adm,.role-viewer .edt,.locked .edt{display:none!important}
.role-viewer .pick{cursor:default}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.live.ok i{background:var(--acc);box-shadow:0 0 0 3px rgba(31,224,138,.2);animation:pulse 2s infinite}
.live.off i{background:var(--warn)}.live.wait i{background:var(--acc2)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(31,224,138,0)}}
.rolechip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--panel2);color:var(--text);cursor:pointer;white-space:nowrap}
.rolechip.admin{color:#ffd590;border-color:rgba(245,165,36,.45);background:rgba(245,165,36,.1)}
.rolechip.editor{color:#8bb8ff;border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.1)}
.rolechip.viewer{color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--border2);border-top-color:var(--acc);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.cta-card{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:16px;border-radius:16px;border:1px solid rgba(31,224,138,.4);background:linear-gradient(120deg,rgba(31,224,138,.14),rgba(59,130,246,.08));cursor:pointer;color:var(--text);text-align:left}
.cta-card:hover{border-color:var(--acc)}
.cta-card>svg{color:var(--acc);flex:none}

'use strict';
/* =========================================================
   FC Mobile · Manager Turnee Interligi
   Un singur fișier. Datele stau în memorie și se salvează
   într-un fișier JSON (salvare automată unde browserul permite).
   Pentru legarea la o bază de date externă se înlocuiește
   doar obiectul Sync (Firebase Realtime Database).
   ========================================================= */

/* ---------- utilitare ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
function shuffle(a){ a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const sign = n => n > 0 ? '+' + n : String(n);
function download(name, text, mime = 'text/plain'){
  const b = new Blob([text], {type: mime + ';charset=utf-8'}); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function readImage(file, max = 180){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png'));
    }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copiat în clipboard'); }
  catch { modal('Copiază textul', `<textarea style="min-height:280px" readonly>${esc(txt)}</textarea>`, {}); }
}

  let hash = H.slice(0, 8);
  for (let j = 0; j < w.length;){
    const W = w.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++){
      const w15 = W[i - 15], w2 = W[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr_(e, 6) ^ rr_(e, 11) ^ rr_(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i]
        + (W[i] = i < 16 ? W[i] : (W[i - 16] + (rr_(w15, 7) ^ rr_(w15, 18) ^ (w15 >>> 3)) + W[i - 7] + (rr_(w2, 17) ^ rr_(w2, 19) ^ (w2 >>> 10))) | 0);

      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;

  }

function duelRes(d, S){

  else out = hg > ag ? 'H' : ag > hg ? 'A' : 'D';
  const uH = m ? hw : (out === 'H' ? 1 : 0), uA = m ? aw : (out === 'A' ? 1 : 0);
  return { complete: played === n, played, hg, ag, hw, aw, out, uH, uA };
}

}
function fxStatus(t, f){
  const r = fixtureRes(t, f);
  if (r.complete) return {k: 'fin', txt: 'Finalizat', cls: 'ok'};
  if (r.touched) return {k: 'live', txt: `În desfășurare ${r.done}/${r.total}`, cls: 'warn'};
  if (r.drawn) return {k: 'drawn', txt: 'Perechi extrase', cls: 'blue'};
  return {k: 'sch', txt: 'Programat', cls: ''};
}
function standings(t){
  const S = t.settings;
  const rows = new Map(t.leagues.map(l => [l.id, {l, id: l.id, P: 0, W: 0, D: 0, L: 0, pts: 0, uW: 0, uL: 0, dW: 0, dD: 0, dL: 0, gf: 0, ga: 0, form: []}]));
  const fxs = [...t.fixtures].sort((a, b) => a.round - b.round);
  for (const f of fxs){
    const r = fixtureRes(t, f); if (!r.complete) continue;
    const h = rows.get(f.homeId), a = rows.get(f.awayId); if (!h || !a) continue;
    h.P++; a.P++; h.uW += r.uH; h.uL += r.uA; a.uW += r.uA; a.uL += r.uH;
    h.gf += r.gH; h.ga += r.gA; a.gf += r.gA; a.ga += r.gH;
    h.dW += r.dH; h.dL += r.dA; h.dD += r.dD; a.dW += r.dA; a.dL += r.dH; a.dD += r.dD;
    if (r.out === 'H'){ h.W++; a.L++; h.pts += S.ptsWin; a.pts += S.ptsLoss; h.form.push('V'); a.form.push('I'); }
    else if (r.out === 'A'){ a.W++; h.L++; a.pts += S.ptsWin; h.pts += S.ptsLoss; a.form.push('V'); h.form.push('I'); }
    else { h.D++; a.D++; h.pts += S.ptsDraw; a.pts += S.ptsDraw; h.form.push('E'); a.form.push('E'); }
  }
  const arr = [...rows.values()]; arr.forEach(x => { x.gd = x.gf - x.ga; x.ud = x.uW - x.uL; });
  const h2h = (a, b) => { let p = 0; for (const f of t.fixtures){ const r = fixtureRes(t, f); if (!r.complete) continue;
    if (f.homeId === a && f.awayId === b) p += r.out === 'H' ? S.ptsWin : r.out === 'D' ? S.ptsDraw : S.ptsLoss;
    if (f.awayId === a && f.homeId === b) p += r.out === 'A' ? S.ptsWin : r.out === 'D' ? S.ptsDraw : S.ptsLoss; } return p; };
  const chain = {duels: ['pts', 'ud', 'gd', 'gf'], gd: ['pts', 'gd', 'gf', 'ud'], h2h: ['pts', 'h2h', 'ud', 'gd', 'gf']}[S.tiebreak] || ['pts', 'ud', 'gd', 'gf'];
  arr.sort((a, b) => { for (const k of chain){ const d = k === 'h2h' ? h2h(b.id, a.id) - h2h(a.id, b.id) : b[k] - a[k]; if (d) return d; } return a.l.name.localeCompare(b.l.name); });
  return arr;
}
function playerStats(t){
  const S = t.settings, m = new Map();
  const get = pid => { if (!m.has(pid)) m.set(pid, {pid, d: 0, w: 0, dr: 0, l: 0, mp: 0, mw: 0, md: 0, ml: 0, gf: 0, ga: 0, wo: 0}); return m.get(pid); };
  for (const f of t.fixtures) for (const d of f.duels){
    const r = duelRes(d, S); if (!r.complete) continue;
    for (const side of ['H', 'A']){
      const pid = side === 'H' ? d.homePid : d.awayPid; if (!pid) continue; const s = get(pid);
      s.d++; if (r.out === side) s.w++; else if (r.out === 'D') s.dr++; else s.l++;
      s.gf += side === 'H' ? r.hg : r.ag; s.ga += side === 'H' ? r.ag : r.hg;
      if (r.forfeit){ if (r.out !== side) s.wo++; continue; }
      for (const g of d.games){ s.mp++; const my = side === 'H' ? g.h : g.a, op = side === 'H' ? g.a : g.h; if (my > op) s.mw++; else if (my < op) s.ml++; else s.md++; }
    }
  }
  return t.players.map(p => { const s = m.get(p.id) || get(p.id); return {...s, p, pts: s.w * 3 + s.dr, gd: s.gf - s.ga, wp: pct(s.w, s.d)}; });
}
function generateSchedule(t){
  let ids = shuffle(t.leagues.map(l => l.id)); if (ids.length % 2) ids.push(null);
  const n = ids.length, rounds = [];
  for (let r = 0; r < n - 1; r++){
    const pairs = [];
    for (let i = 0; i < n / 2; i++){ const a = ids[i], b = ids[n - 1 - i]; if (a && b) pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(shuffle(pairs));
    ids = [ids[0], ids[n - 1], ...ids.slice(1, n - 1)];
  }
  const order = shuffle(rounds), fixtures = [];
  const mk = (round, h, a) => ({id: uid(), round, homeId: h, awayId: a, date: '', lineupHome: null, lineupAway: null, duels: []});
  order.forEach((ps, i) => ps.forEach(([h, a]) => fixtures.push(mk(i + 1, h, a))));
  if (t.settings.legs === 2) order.forEach((ps, i) => ps.forEach(([h, a]) => fixtures.push(mk(order.length + i + 1, a, h))));
  t.fixtures = fixtures;
}
const activePlayers = (t, lid) => t.players.filter(p => p.leagueId === lid && p.active !== false);
const defaultLineup = (t, lid) => activePlayers(t, lid).filter(p => p.role === 'titular').map(p => p.id);
const lineup = (t, f, side) => {
  const lid = side === 'home' ? f.homeId : f.awayId, key = side === 'home' ? 'lineupHome' : 'lineupAway';
  const valid = new Set(activePlayers(t, lid).map(p => p.id));
  return (f[key] || defaultLineup(t, lid)).filter(id => valid.has(id));
};

    <div class="card"><h3>${ic('star')}Top jucători (puncte în dueluri)</h3>${mvp.length ? `<div class="list">${mvp.map((x, i) => `<div class="li"><span class="rank">${i + 1}</span><div class="sp">${plCell(t, x.p, {league: true})}</div><span class="chip">${x.w}V ${x.dr}E ${x.l}I</span><b>${x.pts}p</b></div>`).join('')}</div>` : '<div class="empty">Fără rezultate încă</div>'}</div>
  </div>
  ${last.length ? `<div class="card" style="margin-top:16px"><h3>${ic('list')}Ultimele rezultate</h3><div class="fxlist">${last.map(x => fxCard(t, x.f)).join('')}</div></div>` : ''}`;
}
function rosterWarnings(t){
  const S = t.settings, w = [];
  for (const l of t.leagues){
    const ps = activePlayers(t, l.id), st = ps.filter(p => p.role === 'titular').length, rs = ps.filter(p => p.role !== 'titular').length;
    if (st !== S.starters) w.push(`<b>${esc(l.name)}</b>: ${st}/${S.starters} titulari`);
    else if (rs < S.reserves) w.push(`<b>${esc(l.name)}</b>: ${rs}/${S.reserves} rezerve`);
  }
  if (t.fixtures.length){ const inSch = new Set(t.fixtures.flatMap(f => [f.homeId, f.awayId])); const miss = t.leagues.filter(l => !inSch.has(l.id)); if (miss.length) w.push(`Ligi neincluse în program: ${miss.map(l => esc(l.name)).join(', ')} — regenerează programul.`); }
  return w;
}

/* ---------- LIGI ---------- */
function vLeagues(t){
  const S = t.settings, st = standings(t);

    <div class="row"><button class="btn primary adm" data-act="addLeague">${ic('plus')}Ligă nouă</button></div></div>
  ${t.leagues.length ? `<div class="grid gauto">${t.leagues.map(l => {
    const ps = activePlayers(t, l.id), sN = ps.filter(p => p.role === 'titular').length, rN = ps.length - sN;
    const pos = st.findIndex(x => x.id === l.id) + 1, row = st.find(x => x.id === l.id);
    return `<div class="card lcard" style="--lc:${esc(l.color)}">
      <div class="top">${emblem(l, 58)}<div style="min-width:0;flex:1"><h4>${esc(l.name)}</h4><div class="muted" style="font-size:12.5px">${l.manager ? 'Manager: ' + esc(l.manager) : 'Fără manager setat'}</div></div>
        <div class="row" style="gap:2px"><button class="icon-btn adm" data-act="editLeague" data-id="${l.id}" title="Editează">${ic('edit', 16)}</button><button class="icon-btn danger adm" data-act="delLeague" data-id="${l.id}" title="Șterge">${ic('trash', 16)}</button></div></div>
      <div class="row"><span class="chip ${sN === S.starters ? 'ok' : 'warn'}">Titulari ${sN}/${S.starters}</span><span class="chip ${rN >= S.reserves ? 'ok' : 'warn'}">Rezerve ${rN}/${S.reserves}</span></div>
      <div class="stats"><div><b>${row?.P ? pos : '–'}</b><span>Loc</span></div><div><b>${row?.pts ?? 0}</b><span>Puncte</span></div><div><b>${row ? sign(row.ud) : 0}</b><span>${unitLbl(S)} ±</span></div></div>
      <div class="row"><button class="btn sm" style="flex:1;justify-content:center" data-act="openLeague" data-id="${l.id}">${ic('users', 15)}Lot jucători</button><button class="btn sm adm" data-act="bulkAdd" data-id="${l.id}" title="Adaugă rapid din listă">${ic('list', 15)}Import</button></div>
    </div>`; }).join('')}</div>` : `<div class="empty">Nu există ligi. <br><br><button class="btn primary adm" data-act="addLeague">${ic('plus')}Adaugă prima ligă</button></div>`}`;
}
function leagueForm(t, l){
  l ||= {name: '', short: '', color: COLORS[t.leagues.length % COLORS.length], manager: '', emblem: '', notes: ''};
  return `<div class="fg"><label>Nume ligă *</label><input type="text" name="name" required maxlength="40" value="${esc(l.name)}" placeholder="ex: Liga Nord"></div>
  <div class="frow"><div class="fg"><label>Prescurtare (max 4)</label><input type="text" name="short" maxlength="4" value="${esc(l.short)}" placeholder="NRD"></div>

  <div class="fg"><label>Manager / căpitan</label><input type="text" name="manager" value="${esc(l.manager)}" placeholder="Nume"></div>
  <div class="fg"><label>Emblemă (imagine PNG/JPG/SVG)</label><div class="uploader"><div class="prev" id="embPrev">${l.emblem ? `<img src="${l.emblem}">` : emblem({...l, id: 'pv'}, 50)}</div>
    <div><input type="file" accept="image/*" data-img="emblem" data-prev="embPrev"><input type="hidden" name="emblem" value="${esc(l.emblem)}">
    <div class="row" style="margin-top:8px"><button type="button" class="btn sm ghost" data-act="clearImg" data-f="emblem" data-prev="embPrev">Elimină imaginea</button></div><div class="hint">Fără imagine se generează automat un scut cu inițiale.</div></div></div></div>

}
function vLeague(t){
  const l = Lg(t, ui.leagueId); if (!l){ ui.view = 'leagues'; return vLeagues(t); }
  const S = t.settings, ps = t.players.filter(p => p.leagueId === l.id), stats = new Map(playerStats(t).map(x => [x.pid, x]));
  const row = standings(t).find(x => x.id === l.id);
  const tbl = (list, title, role) => `<div class="card" style="margin-bottom:16px"><h3>${title}<span class="chip">${list.filter(p => p.active !== false).length}</span><span class="sp"></span><button class="btn sm adm" data-act="addPlayer" data-league="${l.id}" data-role="${role}">${ic('plus', 14)}Adaugă</button></h3>
    ${list.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Jucător</th><th class="c hs">OVR</th><th class="c">Dueluri</th><th class="c hs">V-E-I</th><th class="c">Goluri</th><th class="c hs">Status</th><th class="r"></th></tr></thead><tbody>
    ${list.map(p => { const s = stats.get(p.id); return `<tr><td>${plCell(t, p)}</td><td class="c hs">${p.ovr || '–'}</td><td class="c">${s.d}</td><td class="c hs">${s.w}-${s.dr}-${s.l}</td><td class="c">${s.gf}:${s.ga}</td>
      <td class="c hs">${p.active === false ? '<span class="chip bad">Inactiv</span>' : '<span class="chip ok">Activ</span>'}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm ghost adm" data-act="toggleRole" data-id="${p.id}" title="Mută între titulari și rezerve">${ic('swap', 14)}<span class="btxt">${p.role === 'titular' ? 'La rezerve' : 'La titulari'}</span></button><button class="icon-btn adm" data-act="editPlayer" data-id="${p.id}">${ic('edit', 15)}</button><button class="icon-btn danger adm" data-act="delPlayer" data-id="${p.id}">${ic('trash', 15)}</button></td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">Niciun jucător</div>'}</div>`;
  return `<div class="ph"><div class="row" style="gap:16px"><button class="icon-btn" data-act="go" data-v="leagues">${ic('back')}</button>${emblem(l, 64)}<div><h2>${esc(l.name)}</h2><p>${l.manager ? 'Manager: ' + esc(l.manager) + ' · ' : ''}${row?.P ? `${row.pts} puncte · ${row.W}V ${row.D}E ${row.L}I` : 'Niciun meci jucat'}</p></div></div>
    <div class="row"><button class="btn adm" data-act="editLeague" data-id="${l.id}">${ic('edit')}Editează liga</button><button class="btn adm" data-act="bulkAdd" data-id="${l.id}">${ic('list')}Import listă</button></div></div>
    ${tbl(ps.filter(p => p.role === 'titular'), `Titulari <span class="dim">(țintă ${S.starters})</span>`, 'titular')}
    ${tbl(ps.filter(p => p.role !== 'titular'), `Rezerve <span class="dim">(țintă ${S.reserves})</span>`, 'rezerva')}`;
}

/* ---------- JUCĂTORI ---------- */
function vPlayers(t){
  const f = ui.pf, q = f.q.toLowerCase(), stats = new Map(playerStats(t).map(x => [x.pid, x]));
  const list = t.players.filter(p => (!f.league || p.leagueId === f.league) && (!f.role || p.role === f.role) && (!q || (p.name + ' ' + (p.tag || '')).toLowerCase().includes(q)))
    .sort((a, b) => (Lg(t, a.leagueId)?.name || '').localeCompare(Lg(t, b.leagueId)?.name || '') || (a.role === b.role ? 0 : a.role === 'titular' ? -1 : 1) || a.name.localeCompare(b.name));
  return `<div class="ph"><div><h2>Jucători</h2><p>${t.players.length} jucători înscriși în ${t.leagues.length} ligi.</p></div>
    <div class="row"><button class="btn" data-act="exportPlayers">${ic('down')}CSV</button><button class="btn adm" data-act="bulkAdd">${ic('list')}Import listă</button><button class="btn primary adm" data-act="addPlayer" ${t.leagues.length ? '' : 'disabled'}>${ic('plus')}Jucător nou</button></div></div>
  <div class="row" style="margin-bottom:14px">
    <input type="search" placeholder="Caută nume sau ID…" value="${esc(f.q)}" data-input="pfq" style="max-width:280px">
    <select data-change="pf" data-k="league" style="max-width:220px"><option value="">Toate ligile</option>${t.leagues.map(l => `<option value="${l.id}" ${f.league === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>
    <select data-change="pf" data-k="role" style="max-width:170px"><option value="">Titulari + rezerve</option><option value="titular" ${f.role === 'titular' ? 'selected' : ''}>Titulari</option><option value="rezerva" ${f.role === 'rezerva' ? 'selected' : ''}>Rezerve</option></select>
    <span class="muted">${list.length} rezultate</span></div>
  ${list.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Jucător</th><th class="hs">Ligă</th><th class="c hs">Rol</th><th class="c hs">OVR</th><th class="c">Dueluri</th><th class="c hs">V-E-I</th><th class="c">Goluri</th><th class="c hs">Golaveraj</th><th class="r"></th></tr></thead><tbody>
  ${list.map(p => { const s = stats.get(p.id), l = Lg(t, p.leagueId); return `<tr style="${p.active === false ? 'opacity:.5' : ''}"><td>${plCell(t, p, {league: true})}</td><td class="hs">${teamCell(l, 22)}</td>
    <td class="c hs"><span class="chip ${p.role === 'titular' ? 'ok' : 'blue'}">${p.role === 'titular' ? 'Titular' : 'Rezervă'}</span></td><td class="c hs">${p.ovr || '–'}</td><td class="c">${s.d}</td><td class="c hs">${s.w}-${s.dr}-${s.l}</td><td class="c">${s.gf}:${s.ga}</td><td class="c b hs">${sign(s.gd)}</td>
    <td class="r" style="white-space:nowrap"><button class="icon-btn adm" data-act="editPlayer" data-id="${p.id}">${ic('edit', 15)}</button><button class="icon-btn danger adm" data-act="delPlayer" data-id="${p.id}">${ic('trash', 15)}</button></td></tr>`; }).join('')}
  </tbody></table></div>` : `<div class="empty">${t.leagues.length ? 'Niciun jucător găsit.' : 'Adaugă întâi o ligă.'}</div>`}`;
}
function playerForm(t, p, defaults = {}){

  <div class="fg"><label>Rol</label><select name="role"><option value="titular" ${p.role === 'titular' ? 'selected' : ''}>Titular</option><option value="rezerva" ${p.role !== 'titular' ? 'selected' : ''}>Rezervă</option></select></div></div>
  <div class="frow"><div class="fg"><label>OVR echipă</label><input type="number" name="ovr" min="0" max="200" value="${esc(p.ovr)}"></div>

    <div><input type="file" accept="image/*" data-img="avatar" data-prev="avPrev"><input type="hidden" name="avatar" value="${esc(p.avatar)}"><div class="row" style="margin-top:8px"><button type="button" class="btn sm ghost" data-act="clearImg" data-f="avatar" data-prev="avPrev">Elimină poza</button></div></div></div></div>
  <div class="fg"><label>Note</label><input type="text" name="notes" value="${esc(p.notes)}"></div>
  <label class="check"><input type="checkbox" name="active" ${p.active !== false ? 'checked' : ''}> Jucător activ (disponibil pentru extragere)</label>`;

/* ---------- PROGRAM ---------- */
function fxCard(t, f){
  const H = Lg(t, f.homeId), A = Lg(t, f.awayId), r = fixtureRes(t, f), s = fxStatus(t, f);
  const date = f.date ? new Date(f.date).toLocaleString('ro-RO', {weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
  return `<div class="fx" data-act="openFx" data-id="${f.id}">
    <div class="team home ${r.complete && r.out === 'H' ? 'win' : ''}" style="justify-content:flex-end"><b>${esc(H?.name)}</b>${emblem(H, 34)}</div>
    <div class="sc">${r.touched || r.complete ? `<div class="s">${r.uH} – ${r.uA}</div>` : '<div class="vs">VS</div>'}<div style="margin-top:4px"><span class="chip ${s.cls}">${s.txt}</span></div>${date ? `<div class="dim" style="font-size:11px;margin-top:4px">${date}</div>` : `<div class="dim" style="font-size:11px;margin-top:4px">Etapa ${f.round}</div>`}${dlMini(roundDl(t, f.round), r.complete)}</div>
    <div class="team ${r.complete && r.out === 'A' ? 'win' : ''}">${emblem(A, 34)}<b>${esc(A?.name)}</b></div></div>`;
}
function vSchedule(t){
  const S = t.settings, fx = t.fixtures;
  const rounds = [...new Set(fx.map(f => f.round))].sort((a, b) => a - b);
  const started = fx.some(f => fixtureRes(t, f).touched);
  return `<div class="ph"><div><h2>Program & meciuri</h2><p>${t.leagues.length} ligi · ${rounds.length} etape · ${fx.length} meciuri între ligi · ${S.legs === 2 ? 'tur-retur' : 'tur'} · fiecare ligă joacă cu fiecare</p></div>
    <div class="row">${fx.length ? `<button class="btn" data-act="copySchedule">${ic('copy')}Copiază programul</button><button class="btn ${started ? 'danger' : ''} adm" data-act="genSchedule">${ic('shuffle')}Regenerează</button>` : `<button class="btn primary adm" data-act="genSchedule" ${t.leagues.length < 2 ? 'disabled' : ''}>${ic('shuffle')}Generează program aleatoriu</button>`}</div></div>
  ${!fx.length ? `<div class="empty">${t.leagues.length < 2 ? 'Ai nevoie de cel puțin 2 ligi.' : `Programul nu e generat încă. Aplicația va crea aleatoriu ${t.leagues.length % 2 ? t.leagues.length : t.leagues.length - 1} etape în care fiecare ligă întâlnește fiecare altă ligă${S.legs === 2 ? ' (tur și retur)' : ''}.`}</div>` :
  rounds.map(r => { const list = fx.filter(f => f.round === r); const ids = new Set(list.flatMap(f => [f.homeId, f.awayId])); const bye = t.leagues.filter(l => !ids.has(l.id));
    const doneN = list.filter(f => fixtureRes(t, f).complete).length;
    return `<div class="round"><div class="round-h"><h3>Etapa ${r}</h3><span class="chip ${doneN === list.length ? 'ok' : ''}">${doneN}/${list.length} finalizate</span>${bye.length ? `<span class="chip">Stă: ${bye.map(l => esc(l.name)).join(', ')}</span>` : ''}${dlChip(roundDl(t, r), doneN === list.length)}<span class="sp" style="flex:1"></span>${canEdit() ? `<button class="btn sm ghost" data-act="roundDl" data-r="${r}">${ic('clock', 14)}${roundDl(t, r) ? 'Modifică termenul' : 'Setează termen'}</button>` : ''}<button class="btn sm" data-act="shotRound" data-r="${r}">${ic('cam', 14)}Captură etapă</button></div>
      <div class="fxlist">${list.map(f => fxCard(t, f)).join('')}</div></div>`; }).join('')}`;
}

/* ---------- MECI (2 ligi) ---------- */
function vFixture(t){
  const f = t.fixtures.find(x => x.id === ui.fxId); if (!f){ ui.view = 'schedule'; return vSchedule(t); }
  const S = t.settings, H = Lg(t, f.homeId), A = Lg(t, f.awayId), r = fixtureRes(t, f);
  const head = `<div class="row between noprint fxtools" style="margin-bottom:14px"><button class="btn ghost" data-act="go" data-v="schedule">${ic('back')}Înapoi la program</button>
    <div class="row"><label class="muted" style="font-size:12px">Data & ora meciului</label><input type="datetime-local" value="${esc(f.date)}" data-change="fxDate" style="width:auto" ${canEdit() ? '' : 'disabled'}>
    ${f.duels.length ? `<button class="btn primary" data-act="shotFx">${ic('cam')}Captură meci</button><button class="btn" data-act="copyFx">${ic('copy')}Copiază fișa</button><button class="btn" data-act="print">${ic('print')}Printează</button>` : ''}</div></div>
    <div class="match-head" style="--hc:${esc(H?.color)};--ac:${esc(A?.color)}">
      <div class="side">${emblem(H, 84)}<h3>${esc(H?.name)}</h3><span class="muted">${esc(H?.manager || '')}</span></div>
      <div class="score"><div class="dim" style="font-size:12px;margin-bottom:6px">ETAPA ${f.round}</div><div class="big" id="fx-score">${r.drawn ? `${r.uH}–${r.uA}` : 'VS'}</div><div class="lbl">${unitLbl(S)} câștigate</div><div id="fx-sub" style="margin-top:10px">${fxSub(t, f)}</div>${roundDl(t, f.round) ? `<div style="margin-top:8px"><div class="dim" style="font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px">Finalizare etapă</div>${dlChip(roundDl(t, f.round), r.complete)}</div>` : ''}</div>
      <div class="side">${emblem(A, 84)}<h3>${esc(A?.name)}</h3><span class="muted">${esc(A?.manager || '')}</span></div></div>`;
  if (!f.duels.length){
    const lh = lineup(t, f, 'home'), la = lineup(t, f, 'away'), ok = lh.length > 0 && lh.length === la.length;
    const panel = (side, l, sel) => { const ps = activePlayers(t, l.id).sort((a, b) => (a.role === b.role ? a.name.localeCompare(b.name) : a.role === 'titular' ? -1 : 1));
      return `<div class="card"><h3>${emblem(l, 24)}${esc(l.name)}<span class="sp"></span><span class="chip ${sel.length === S.starters ? 'ok' : 'warn'}">${sel.length}/${S.starters} selectați</span></h3>
      ${ps.length ? `<div class="picks">${ps.map(p => `<div class="pick ${sel.includes(p.id) ? 'on' : ''} edt" data-act="togglePick" data-side="${side}" data-id="${p.id}"><span class="box"></span>${avatar(t, p, 26)}<div style="min-width:0"><div class="n" style="font-weight:600;font-size:13px">${esc(p.name)}</div><div class="dim" style="font-size:11px">${p.role === 'titular' ? 'Titular' : 'Rezervă'}${p.tag ? ' · ' + esc(p.tag) : ''}</div></div></div>`).join('')}</div>` : '<div class="empty">Liga nu are jucători activi.</div>'}
      <div class="row" style="margin-top:12px"><button class="btn sm ghost edt" data-act="resetPick" data-side="${side}">Doar titularii</button><button class="btn sm ghost edt" data-act="clearPick" data-side="${side}">Golește</button></div></div>`; };
    if (!canEdit()) return head + `<div class="banner info">${ic('shuffle')}<div>Perechile pentru acest meci nu au fost extrase încă. Revino după ce organizatorii fac tragerea la sorți.</div></div>`;
    return head + `<div class="banner info">${ic('shuffle')}<div>Bifează jucătorii care joacă (titularii sunt preselectați, înlocuiește cu rezerve dacă e nevoie). Apoi aplicația extrage <b>aleatoriu</b> adversarul fiecărui jucător; fiecare pereche joacă ${S.matchesPerDuel} ${S.matchesPerDuel === 1 ? 'meci' : 'meciuri'}.</div></div>
      <div class="grid g2">${panel('home', H, lh)}${panel('away', A, la)}</div>
      <div class="row" style="justify-content:center;margin-top:20px"><button class="btn primary edt" style="padding:13px 26px;font-size:15px" data-act="draw" ${ok ? '' : 'disabled'}>${ic('shuffle')}Extrage perechile aleatoriu</button></div>
      ${ok ? '' : `<p class="muted" style="text-align:center">Ambele ligi trebuie să aibă același număr de jucători selectați (acum ${lh.length} vs ${la.length}).</p>`}`;
  }
  const gh = Array.from({length: S.matchesPerDuel}, (_, i) => `<th class="c">Meci ${i + 1}</th>`).join('');
  return head + `<div class="card"><h3>${ic('swap')}Dueluri · ${f.duels.length} perechi<span class="sp"></span>
      ${!r.touched ? `<button class="btn sm edt" data-act="redraw">${ic('shuffle', 14)}Re-extrage</button>` : ''}<button class="btn sm ghost edt" data-act="undoDraw">${ic('undo', 14)}Anulează extragerea</button></h3>
    <div class="tw"><table class="tbl duels ${ui.justDrawn === f.id ? 'reveal' : ''}"><thead><tr><th class="c">#</th><th>${esc(H?.name)}</th>${gh}<th class="c">Total</th><th>${esc(A?.name)}</th><th class="c">Termen finalizare</th><th class="c">Captură / Neprezentare</th></tr></thead><tbody>
    ${f.duels.map((d, i) => duelRow(t, f, d, i)).join('')}</tbody></table></div>

function copyRoster(src, dst){
  const map = {}; dst.leagues = src.leagues.map(l => { const id = uid(); map[l.id] = id; return {...l, id}; });
  dst.players = src.players.map(p => ({...p, id: uid(), leagueId: map[p.leagueId]}));
}

const NEED_ADMIN = new Set(['finishT', 'reopenT', 'renameT', 'addLeague', 'editLeague', 'delLeague', 'bulkAdd', 'addPlayer', 'toggleRole', 'editPlayer', 'delPlayer', 'genSchedule', 'newTournament', 'activateT', 'dupT', 'delT', 'resetResults', 'resetApp', 'exportJSON', 'importJSON', 'showAudit']);
const NEED_EDIT = new Set(['roundDl', 'duelDl', 'togglePick', 'resetPick', 'clearPick', 'draw', 'redraw', 'undoDraw', 'sub', 'doSub', 'scoreSheet', 'stp', 'sheetWO', 'sheetClear', 'sheetNext', 'sheetGo']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'closeModal' && el.classList.contains('overlay') && e.target !== el) return;
  if (el.disabled) return;
  if ((NEED_ADMIN.has(act) && !isAdmin()) || (NEED_EDIT.has(act) && !canEdit())){ e.preventDefault(); return toast(NEED_ADMIN.has(act) ? 'Doar administratorul poate face asta' : isFinished() && loggedIn() ? 'Turneul e încheiat — rezultatele sunt blocate' : 'Autentifică-te ca editor pentru a modifica', 'warn'); }
  if (A[act]){ e.preventDefault(); A[act](el.dataset, el); }
});
document.addEventListener('change', async e => {
  const el = e.target, t = T();
  if (el.dataset.img){
    const file = el.files[0]; if (!file) return;
    try { const url = await readImage(file, el.dataset.img === 'avatar' ? 160 : 200); $('#mform').querySelector(`[name=${el.dataset.img}]`).value = url; $('#' + el.dataset.prev).innerHTML = `<img src="${url}">`; }
    catch { toast('Imagine invalidă', 'err'); }
    return;
  }
  const c = el.dataset.change; if (!c) return;
  if (c === 'switchT'){ ui.viewT = el.value; ui.view = 'dashboard'; render(); return; }
  if (['tmeta', 'setting'].includes(c) && !isAdmin()) return toast('Doar administratorul poate modifica setările', 'warn');
  if (['fxDate', 'forfeit'].includes(c) && !canEdit()) return;
  else if (c === 'pf'){ ui.pf[el.dataset.k] = el.value; render(); }
  else if (c === 'statsLeague'){ ui.statsLeague = el.value; render(); }
  else if (c === 'tmeta'){ t[el.dataset.k] = el.value.trim() || t[el.dataset.k]; commit(); }
  else if (c === 'setting'){ const k = el.dataset.k; let v = el.value;
    if (!['duelMode', 'tiebreak'].includes(k)){ v = parseInt(v, 10); if (isNaN(v)) return render(); v = Math.max(+el.min || 0, Math.min(+el.max || 999, v)); }
    t.settings[k] = v; commit(); Sync.audit(`Setare ${k} = ${v}`); toast('Setare salvată'); }
  else if (c === 'fxDate'){ const f = t.fixtures.find(x => x.id === ui.fxId); f.date = el.value; Sync.saveFx(t, f); }
  else if (c === 'forfeit'){ const f = t.fixtures.find(x => x.id === ui.fxId), d = f.duels.find(x => x.id === el.dataset.duel); d.forfeit = el.value || null; Sync.saveDuel(t, f, d); render(); Sync.audit(`Neprezentare ${fxLabel(t, f)} duel ${f.duels.indexOf(d) + 1}: ${d.forfeit || 'anulată'}`); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'pfq'){ ui.pf.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-input=pfq]'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.sheet){ const k = +el.dataset.k; let v = el.value === '' ? null : Math.max(0, Math.min(99, parseInt(el.value, 10))); if (Number.isNaN(v)) v = null; ui.sheet.games[k][el.dataset.s] = v; ui.sheet.forfeit = null; paintSheetSummary(); return; }
  if (el.dataset.in === 'score'){
    if (!canEdit()) return;
    const t = T(), f = t.fixtures.find(x => x.id === ui.fxId), d = f.duels.find(x => x.id === el.dataset.duel);
    const before = fixtureRes(t, f).complete;
    let v = el.value === '' ? null : Math.max(0, Math.min(99, parseInt(el.value, 10))); if (Number.isNaN(v)) v = null;
    d.games[+el.dataset.g][el.dataset.s] = v;
    clearTimeout(duelTimers[d.id]); duelTimers[d.id] = setTimeout(() => { Sync.saveDuel(t, f, d); const dr = duelRes(d, t.settings); if (dr.complete) Sync.audit(`Scor ${fxLabel(t, f)} · duel ${f.duels.indexOf(d) + 1} (${Pl(t, d.homePid)?.name} – ${Pl(t, d.awayPid)?.name}): ${d.games.map(g => g.h + '-' + g.a).join(' / ')}`); }, 600);
    const r = liveUpdate(t, f, d);
    if (!before && r.complete){ const w = r.out === 'H' ? Lg(t, f.homeId).name : r.out === 'A' ? Lg(t, f.awayId).name : null; toast(w ? `Meci încheiat: ${w} câștigă ${Math.max(r.uH, r.uA)}-${Math.min(r.uH, r.uA)}` : `Meci încheiat la egalitate ${r.uH}-${r.uA}`); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.overlay')) closeModal();
  if (e.key === 'Enter' && e.target.dataset?.in === 'score'){ // Enter → următoarea căsuță de scor
    e.preventDefault(); const all = [...document.querySelectorAll('[data-in=score]:not([disabled])')]; const i = all.indexOf(e.target); all[i + 1]?.focus(); all[i + 1]?.select(); }
});
$('#importInput').addEventListener('change', async e => { const file = e.target.files[0]; e.target.value = ''; if (!file || !isAdmin()) return;
  try { const d = JSON.parse(await file.text()); if (!d || !Array.isArray(d.tournaments) || !d.tournaments.length) throw new Error('format necunoscut');
    confirmBox(`Restaurezi ${d.tournaments.length} turnee din backup? <b>Toate datele actuale din baza de date vor fi înlocuite</b> pentru toată lumea.`, () => {
      state = {version: 1, activeId: d.activeId && d.tournaments.some(t => t.id === d.activeId) ? d.activeId : d.tournaments[0].id, tournaments: d.tournaments.map(normT)}; ui.viewT = null; ui.view = 'dashboard';
      Sync.replaceAll(); Sync.audit('Restaurare din backup'); render(); toast('Backup restaurat'); }, 'Restaurează');
  } catch(err){ toast('Fișier invalid: ' + err.message, 'err'); } });

/* ---------- foaia de introducere scor (telefon) ---------- */
function sheetCtx(){ const t = T(), f = t?.fixtures.find(x => x.id === ui.fxId), d = f?.duels.find(x => x.id === ui.sheet?.duel); return {t, f, d}; }
function openSheet(duelId){
  const t = T(), f = t.fixtures.find(x => x.id === ui.fxId), d = f?.duels.find(x => x.id === duelId); if (!d) return;
  const fresh = d.games.every(g => g.h == null && g.a == null) && !d.forfeit;
  ui.sheet = {duel: d.id, forfeit: d.forfeit || null, cleared: false, games: d.games.map(g => ({h: fresh ? 0 : g.h, a: fresh ? 0 : g.a}))};
  const i = f.duels.indexOf(d);
  modal(`Duel ${i + 1} din ${f.duels.length}`, '<div id="sheet"></div>', {submit: 'Salvează', onSubmit: () => saveSheet(false), extra: `<button type="button" class="btn blue" data-act="sheetNext">Salvează &amp; următorul${ic('chev', 16)}</button>`});
  $('.modal').classList.add('sheetmodal'); paintSheet();
}
function paintSheet(){
  const {t, f, d} = sheetCtx(); if (!d) return closeModal(); const s = ui.sheet, H = Lg(t, f.homeId), A_ = Lg(t, f.awayId), hp = Pl(t, d.homePid), ap = Pl(t, d.awayPid);
  const pl = (p, l) => `<div class="sp-pl">${avatar(t, p, 46)}<b>${esc(p?.name || '?')}</b><span class="team" style="justify-content:center;font-size:11.5px;gap:5px">${emblem(l, 16)}<span class="muted">${esc(l?.name)}</span></span></div>`;
  const step = (k, side) => { const v = s.games[k][side]; return `<div class="stepper"><button type="button" class="sbtn" data-act="stp" data-k="${k}" data-s="${side}" data-v="-1" aria-label="minus">${ic('minus', 22)}</button>
    <input type="number" inputmode="numeric" min="0" max="99" value="${v ?? ''}" data-sheet="1" data-k="${k}" data-s="${side}" onfocus="this.select()"><button type="button" class="sbtn plus" data-act="stp" data-k="${k}" data-s="${side}" data-v="1" aria-label="plus">${ic('plus', 22)}</button></div>`; };
  const others = f.duels.map((x, j) => { const r = duelRes(x, t.settings); return `<button type="button" class="dot ${x.id === d.id ? 'on' : ''} ${r.complete ? 'ok' : r.played ? 'part' : ''}" data-act="sheetGo" data-duel="${x.id}">${j + 1}</button>`; }).join('');
  const sdl = duelDl(t, f, d);
  $('#sheet').innerHTML = `<div class="sp-head">${pl(hp, H)}<div class="sp-tot" id="sp-tot"></div>${pl(ap, A_)}</div>
    ${sdl ? `<div style="text-align:center;margin:0 0 10px">${dlChip(sdl, duelRes(d, t.settings).complete)}</div>` : ''}
    ${s.games.map((g, k) => `<div class="sp-game ${s.forfeit ? 'off' : ''}"><div class="lbl">Meci ${k + 1}</div><div class="sp-row">${step(k, 'h')}<span class="colon">:</span>${step(k, 'a')}</div></div>`).join('')}
    <div class="sp-wo"><span class="muted" style="font-size:12px">Neprezentare</span><div class="seg"><button type="button" class="${!s.forfeit ? 'on' : ''}" data-act="sheetWO" data-v="">Nu</button><button type="button" class="${s.forfeit === 'home' ? 'on' : ''}" data-act="sheetWO" data-v="home">Lipsește ${esc((hp?.name || 'gazda').split(' ')[0])}</button><button type="button" class="${s.forfeit === 'away' ? 'on' : ''}" data-act="sheetWO" data-v="away">Lipsește ${esc((ap?.name || 'oaspetele').split(' ')[0])}</button></div></div>
    <div class="dots">${others}</div>
    <button type="button" class="btn ghost sm" data-act="sheetClear" style="margin:6px auto 0;display:flex">${ic('undo', 14)}Șterge scorul acestui duel</button>`;
  paintSheetSummary();
}
function paintSheetSummary(){
  const {t, d} = sheetCtx(); const el = $('#sp-tot'); if (!el || !d) return;
  const r = duelRes({...d, games: ui.sheet.games, forfeit: ui.sheet.forfeit}, t.settings), hp = Pl(t, d.homePid), ap = Pl(t, d.awayPid);
  el.innerHTML = `<div class="big">${r.played || r.forfeit ? `${r.hg}:${r.ag}` : '–'}</div><div class="res ${r.complete ? (r.out === 'D' ? 'd' : 'w') : ''}">${!r.complete ? 'incomplet' : r.out === 'D' ? 'Egal' : 'Câștigă ' + esc(((r.out === 'H' ? hp : ap)?.name || '').split(' ')[0])}</div>`;
}
function saveSheet(next){
  const {t, f, d} = sheetCtx(); if (!d) return;
  const s = ui.sheet, complete = s.forfeit || s.games.every(g => g.h != null && g.a != null);
  if (!complete && !s.cleared){ toast('Completează scorul la toate meciurile', 'warn'); return false; }
  const before = fixtureRes(t, f).complete;
  d.games = s.games.map(g => ({h: g.h, a: g.a})); d.forfeit = s.forfeit || null;
  Sync.saveDuel(t, f, d);
  Sync.audit(`Scor ${fxLabel(t, f)} · duel ${f.duels.indexOf(d) + 1} (${Pl(t, d.homePid)?.name} – ${Pl(t, d.awayPid)?.name}): ${d.forfeit ? 'W.O. ' + d.forfeit : d.games.map(g => (g.h ?? '-') + '-' + (g.a ?? '-')).join(' / ')}`);
  const r = fixtureRes(t, f);
  if (!before && r.complete){ const w = r.out === 'H' ? Lg(t, f.homeId).name : r.out === 'A' ? Lg(t, f.awayId).name : null; toast(w ? `Meci încheiat: ${w} câștigă ${Math.max(r.uH, r.uA)}-${Math.min(r.uH, r.uA)}` : `Meci încheiat la egalitate ${r.uH}-${r.uA}`); }
  else toast('Scor salvat');
  render();
  if (next){
    const i = f.duels.indexOf(d), order = [...f.duels.slice(i + 1), ...f.duels.slice(0, i)];
    const nx = order.find(x => !duelRes(x, t.settings).complete);
    if (nx){ openSheet(nx.id); return false; }
    closeModal(); toast('Toate duelurile au scor'); return false;
  }
  return true;
}

/* ---------- start ---------- */
Sync.init(); render();
</script>
</body>
</html>
